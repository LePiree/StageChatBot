name: CI — Wedding Chatbot

# Déclencheurs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Job 1 : Lint (flake8)
  # Vérifie la qualité syntaxique du code Python.
  # --------------------------------------------------------------------------
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installation des dépendances de lint
        run: pip install flake8

      - name: Lancement de flake8
        # E501 : lignes longues ignorées (prompts LLM peuvent dépasser 79 chars)
        run: flake8 backend/ --exclude=backend/tests/ --max-line-length=120 --ignore=E501

  # --------------------------------------------------------------------------
  # Job 2 : Tests automatisés (pytest)
  # Lance les 16 tests unitaires avec mock Ollama (pas de vraie instance requise).
  # Couvre : cas nominaux, validations d'entrée, comportement si Ollama est down.
  # --------------------------------------------------------------------------
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installation des dépendances
        run: |
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Lancement des tests pytest
        run: python -m pytest backend/tests/ -v --tb=short

  # --------------------------------------------------------------------------
  # Job 3 : Build Docker
  # Vérifie que l'image Docker du backend se construit sans erreur.
  # Le push vers un registre est optionnel et non activé ici.
  # --------------------------------------------------------------------------
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: wedding-chatbot-backend:${{ github.sha }}
